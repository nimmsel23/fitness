viz:
  body_muscles:
    view: FRONT
    ids:
    - serratus-anterior-left
    - serratus-anterior-right
origin: Äußere Flächen der 1. bis 9. Rippe.
insertion: Margo medialis der Scapula (vor allem Angulus superior und inferior).
innervation: Nervus thoracicus longus (C5-C7).
function: 'Protraktion und Fixation der Scapula am Thorax; unterstützt gemeinsam mit dem Trapezius die
  Aufwärtsrotation. Mittlere/untere Fasern tragen zur posterioren Kippung und Außenrotation der Scapula
  bei der Armhebung bei. Grundlage: Phadke V, Camargo PR, Ludewig PM (2009): Scapular and rotator cuff
  muscle activity during arm elevation: A review of normal function and alterations with shoulder impingement.
  Braz J Phys Ther 13(1):1–9. https://doi.org/10.1590/S1413-35552009005000012'

function: 'Pars ascendens: trägt im Zusammenspiel mit M. serratus anterior und oberem Trapezius zur Aufwärtsrotation
  und Stabilisierung der Scapula bei. Depression ist eine Teilfunktion, keine Vorgabe zur dauerhaften
  Schulterblattfixierung beim Überkopfdrücken. Grundlage: Phadke V, Camargo PR, Ludewig PM (2009): Scapular
  and rotator cuff muscle activity during arm elevation: A review of normal function and alterations with
  shoulder impingement. Braz J Phys Ther 13(1):1–9. https://doi.org/10.1590/S1413-35552009005000012'
